<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Tete Rafting Adventure - Contact Us</title>
    <meta name="description"
      content="Tété is creating his first web contact page for white water rafting.">
    <meta name="author" content="Date Tété">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting3.jpg" alt="Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <h1>White Whiter Tete Rafting</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 999</p>
            <p>dateflorentin81@gmail.com</p>
        </div>
        <div class="map">
            <iframe
              src=" https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.643155856182!2d1.2375872758157427!3d6.178498227074684!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1023e3ca861ae425%3A0xf3defacfe87c5eac!2sMBG%20TOGO!5e0!3m2!1sfr!2stg!4v1770666717546!5m2!1sfr!2stg"
              width="200" height="250" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="user_name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="user_email" required>
                <label>Purpose of Message:</label>
                <div class="radio-group">
                    <label><input type="radio" id="radio" name="purpose" value="General Inquiry"
                          required>
                        General Inquiry</label>
                    <label><input type="radio" id="purpose" name="purpose"
                          value="Reservation Question">
                        Reservation Question</label>
                    <label><input type="radio" id="radio" name="purpose" value="Website Suggestion">
                        Website
                        Suggestion</label>
                </div>
                <label for="message">Message:</label>
                <textarea id="message" name="user_message" rows="5" required></textarea>
                <div class="checkbox">
                    <label><input type="checkbox" name="newsletter"> Please subscribe me to the
                        monthly newsletter</label>
                </div>
                <button type="submit">Submit Form</button>
            </form>
        </div>
        <article>
            <p>We are here to raise you up.</p>
            <img src="images/z-therapidssplash.jpg" alt="The Rapid Splash">
        </article>
        </div>

        <section class="Adventure">
            <h2>Adventure Awaits You!</h2>
            <div class="adventure-gallery">
                <figure class="images-box">
                    <img src="images/rafting5.jpg" alt="The Rapid Splash">
                    <figcaption> Rapid Splash</figcaption>
                </figure>

                <figure class="images-box">
                    <img src="images/rafting1.jpg" alt="Cool Rafting">
                    <figcaption> Cool Rafting</figcaption>
                </figure>

                <figure class="images-box">
                    <img src="images/rafting2.jpg" alt="Super Rafting">
                    <figcaption> Super Rafting</figcaption>
                </figure>

                <figure>
                    <img src="images/rafting3.jpg" alt="Rafting Wahoo">
                    <figcaption>Rafting Wahoo</figcaption>
                </figure>

                <figure>
                    <img src="images/rafting4.jpg" alt="Super Rafting Cool">
                    <figcaption>Rafting Super Cool</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 White Water Tete Rafting | Tete Date</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook Icon"></a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.jpg" alt="LinkedIn Icon"></a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="instagram Icon"> </a>
        </nav>
    </footer>
</body>

</html>
